# Local development stack. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KADE_DB_NAME:-kade}
      POSTGRES_USER: ${KADE_DB_USER:-kade}
      POSTGRES_PASSWORD: ${KADE_DB_PASSWORD:-kade}
      TZ: UTC
    ports:
      - "${KADE_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # HTML-to-PDF for bills (S1-4). Port 3001 on the host, because Next.js uses 3000.
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "${KADE_GOTENBERG_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
