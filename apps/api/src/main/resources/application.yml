spring:
  application:
    name: kade-api
  datasource:
    # Defaults match compose.yaml at the repo root; override with env vars in staging and production.
    url: ${KADE_DB_URL:jdbc:postgresql://localhost:5432/kade}
    username: ${KADE_DB_USER:kade}
    password: ${KADE_DB_PASSWORD:kade}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

kade:
  gotenberg-url: ${KADE_GOTENBERG_URL:http://localhost:3001}
